org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# The project lives on D: while the Pub/Gradle cache lives on C: — Kotlin's
# incremental compiler tries to compute a relative path between the two and
# crashes on Windows ("this and base files have different roots"). Disabling
# incremental Kotlin compilation avoids that path-relativization step.
kotlin.incremental=false
